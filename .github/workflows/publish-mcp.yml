name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - mcp/server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Validate + publish server.json (DNS-verified com.eveoy/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" mcp-publisher
          chmod +x "$HOME/.local/bin/mcp-publisher"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate server.json (description ≤ 100 chars, name matches DNS namespace)
        run: |
          if ! command -v jq >/dev/null; then sudo apt-get install -y jq; fi
          jq -e '.name and .description and .version and (.description | length <= 100)' mcp/server.json
          jq -e '.name | startswith("com.eveoy/")' mcp/server.json
          mcp-publisher validate ./mcp/server.json

      - name: Login (DNS — proves ownership of eveoy.com)
        env:
          DNS_PRIV_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          if [ -z "$DNS_PRIV_KEY" ]; then
            echo "::error::MCP_REGISTRY_DNS_PRIVATE_KEY repo secret is missing."
            echo "Run scripts/setup-dns-key.sh locally to generate it."
            exit 1
          fi
          mcp-publisher login dns --domain eveoy.com --private-key "$DNS_PRIV_KEY"

      - name: Publish
        run: mcp-publisher publish ./mcp/server.json
