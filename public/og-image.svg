<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Eveoy MCP">
  <title>Eveoy MCP — real customers, in real stores, from any AI</title>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD900"/>
      <stop offset="1" stop-color="#FB5C53"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- Big brutal-shadow card holding the message, on cream -->
  <g transform="translate(72 96)">
    <rect x="8" y="8" width="1040" height="430" rx="24" fill="#212121"/>
    <rect width="1040" height="430" rx="24" fill="#FAF8F2"/>

    <!-- y mark inside card -->
    <g transform="translate(56 56) scale(0.32)">
      <rect x="172" y="118" width="62" height="206" rx="31"
            transform="rotate(22 203 221)" fill="#FFD900"/>
      <rect x="278" y="118" width="62" height="298" rx="31"
            transform="rotate(-14 309 267)" fill="#FB5C53"/>
      <text x="425" y="132" font-family="Archivo Black, system-ui, sans-serif"
            font-size="40" font-weight="900" fill="#FB5C53">TM</text>
    </g>

    <text x="248" y="124" font-family="Archivo Black, system-ui, sans-serif"
          font-size="64" fill="#212121" letter-spacing="-2">Eveoy <tspan fill="#FB5C53">MCP</tspan></text>

    <text x="56" y="232" font-family="Archivo Black, system-ui, sans-serif"
          font-size="56" fill="#212121" letter-spacing="-2">Real customers.</text>
    <text x="56" y="296" font-family="Archivo Black, system-ui, sans-serif"
          font-size="56" fill="#212121" letter-spacing="-2">Real stores.</text>
    <text x="56" y="360" font-family="Archivo Black, system-ui, sans-serif"
          font-size="56" fill="#FB5C53" letter-spacing="-2">From any AI.</text>

    <text x="56" y="402" font-family="Manrope, system-ui, sans-serif"
          font-size="22" font-weight="500" fill="#212121" opacity="0.75">$24.99 per real customer · $999 pilot · 100% refunded for no-shows</text>
  </g>

  <text x="600" y="588" text-anchor="middle"
        font-family="Manrope, system-ui, sans-serif"
        font-size="20" font-weight="600" fill="#212121">mcp.eveoy.com</text>
</svg>
