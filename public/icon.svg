<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eveoy">
  <title>Eveoy</title>
  <rect width="512" height="512" rx="96" fill="#FAF8F2"/>
  <!-- Yellow short capsule (left arm of the y), tilted clockwise -->
  <rect x="172" y="118" width="62" height="206" rx="31"
        transform="rotate(22 203 221)" fill="#FFD900"/>
  <!-- Coral long capsule (right arm + descender), tilted counter-clockwise -->
  <rect x="278" y="118" width="62" height="298" rx="31"
        transform="rotate(-14 309 267)" fill="#FB5C53"/>
  <!-- TM mark, coral, baseline-aligned to yellow capsule top -->
  <text x="425" y="132" font-family="Archivo Black, system-ui, sans-serif"
        font-size="40" font-weight="900" fill="#FB5C53">TM</text>
</svg>
